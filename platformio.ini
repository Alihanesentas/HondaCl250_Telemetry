; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_local.ini

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = autowp/autowp-mcp2515@^1.3.1

; Mock telemetry environment: identical hardware target, but MOCK_CAN_DATA swaps
; HondaCANModule out for MockCANModule (see src/main.cpp) so Nextion/BLE/WiFi/
; staleness/watchdog behavior can be verified on the real ESP32-S3 board with no
; Honda ECU/CAN transceiver attached. HondaCANModule itself is unaffected either way.
; Build/upload with: pio run -e esp32-s3-devkitc-1-mock -t upload
[env:esp32-s3-devkitc-1-mock]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -D MOCK_CAN_DATA
