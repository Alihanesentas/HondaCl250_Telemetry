; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_local.ini

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = autowp/autowp-mcp2515@^1.3.1
; test/test_embedded needs Unity running ON the device (Serial output); requires
; the board connected over USB. Not runnable away from the workshop -- see
; [env:native] below for hardware-independent tests.
test_filter = test_embedded

; Mock telemetry environment: identical hardware target, but MOCK_CAN_DATA swaps
; HondaCANModule out for MockCANModule (see src/main.cpp) so Nextion/BLE/WiFi/
; staleness/watchdog behavior can be verified on the real ESP32-S3 board with no
; Honda ECU/CAN transceiver attached. HondaCANModule itself is unaffected either way.
; Build/upload with: pio run -e esp32-s3-devkitc-1-mock -t upload
[env:esp32-s3-devkitc-1-mock]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -D MOCK_CAN_DATA

; G5.1/G5.2 -- Native (host-compiled, no ESP32/device attached) test environment.
; Covers the hardware-independent pieces: SystemState's isStale() staleness logic
; and BLETelemetryPacket's exact wire layout/endianness. Does NOT build src/ (most
; of it depends on ESP32-only libraries like WiFi.h/BLEDevice.h/driver/twai.h that
; don't exist on native); test/test_native includes the two headers under test
; directly by relative path instead.
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=c++11 -I test/native_stubs
test_filter = test_native
test_build_src = no
